# CreditFlow — local orchestration (full-stack: api + web).
# Layout: mỗi service có Dockerfile riêng cạnh source của nó —
#   backend/Dockerfile  (FastAPI serve trực tiếp :8080)
#   frontend/Dockerfile + frontend/nginx.conf (nginx serve dist/ + proxy /api/)
# Build context luôn là repo root để backend COPY được pipeline/ + models/.
# Lệnh chuẩn:
#   docker compose up --build -d   # cả stack
#   docker compose up api -d       # chỉ backend (sweep endpoint đơn lẻ)
#   docker compose down            # teardown (không đụng container repo khác)
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: creditflow-api:latest
    container_name: creditflow-api
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      - MLFLOW_DISABLE_AGENT_HINT=1
      - CREDITFLOW_LLM_PROVIDER=cloudflare
      # Cloudflare Workers AI credentials — load from .env (gitignored).
      # Never hardcode secrets here. Use:
      #   CLOUDFLARE_ACCOUNT_ID=your-account-id
      #   CLOUDFLARE_API_TOKEN=your-api-token
      #   CLOUDFLARE_MODEL=@cf/meta/llama-3.2-1b-instruct
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - creditflow-net
      - portfolio-net

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: creditflow-web:latest
    container_name: creditflow-web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - creditflow-net
      - portfolio-net

  # Self-hosted MLflow tracking stack (persistent metadata + artifacts).
  # Local/private only — never production-HA. Host port 5050 vì macOS AirPlay
  # chiếm 5000 (lsof: ControlCe). Chỉ chạy khi gọi profile:
  #   docker compose --profile mlflow up -d
  #   MLFLOW_TRACKING_URI=http://localhost:5050 python scripts/train_models.py
  postgres-mlflow:
    profiles: ["mlflow"]
    image: postgres:16-alpine
    container_name: creditflow-mlflow-db
    environment:
      - POSTGRES_USER=${MLFLOW_DB_USER:-mlflow}
      - POSTGRES_PASSWORD=${MLFLOW_DB_PASSWORD:-mlflow-dev-only}
      - POSTGRES_DB=${MLFLOW_DB_NAME:-mlflow}
    volumes:
      - mlflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mlflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - creditflow-net

  mlflow:
    profiles: ["mlflow"]
    image: ghcr.io/mlflow/mlflow:v3.16.0
    container_name: creditflow-mlflow
    command: >-
      sh -c "pip install --no-cache-dir psycopg2-binary &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow-dev-only}@postgres-mlflow:5432/${MLFLOW_DB_NAME:-mlflow}
      --default-artifact-root /tmp/creditflow-mlflow-artifacts"
    ports:
      - "127.0.0.1:5050:5000"
    volumes:
      - /tmp/creditflow-mlflow-artifacts:/tmp/creditflow-mlflow-artifacts
    depends_on:
      postgres-mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    networks:
      - creditflow-net

volumes:
  mlflow-postgres:
  mlflow-artifacts:

networks:
  creditflow-net:
    name: creditflow-net
    driver: bridge
  portfolio-net:
    external: true
    name: portfolio-net
