# CreditFlow — local orchestration
services:
  api:
    build: .
    container_name: creditflow-api
    ports:
      - "8080:8080"
    environment:
      - MLFLOW_TRACKING_URI=
      - MLFLOW_DISABLE_AGENT_HINT=1
    restart: unless-stopped

  # Optional MLflow tracking server (enable when a remote store is wanted):
