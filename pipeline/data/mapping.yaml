# Mapping layer: real raw dataset -> CreditFlow canonical schema.
#
# This is the SINGLE place to define how an external credit dataset maps to the
# 8 canonical features + target that the pipeline trains on. Switching datasets
# means adding a mapping config here (or a sibling YAML) without touching the
# model / feature / serving code.
#
# IMPORTANT (migration safety): the PRODUCTION demo still runs on the synthetic
# proxy dataset (data/creditflow_dataset.csv, generated by generate_dataset.py).
# This file is the isolated "real-data track" — ingest.py consumes it to build
# data/processed/ + data/metadata/. It does NOT retrain or replace production.
#
# Reference dataset below: German Credit (Statlog), UCI. Many source columns do
# NOT map to the 8 canonical features, so they are dropped/flagged. That is an
# honest, documented limitation — see docs/data/real-dataset.md.

dataset:
  name: german_credit
  version: "1.0"
  source: "UCI Machine Learning Repository - Statlog (German Credit Data)"
  url: "https://archive.ics.uci.edu/ml/datasets/statlog+(german+credit+data)"
  license: "UCI dataset license - research use"
  description: >
    Real-credit fallback for the real-data track. Small and easy to review.
    Isolated from the production demo.

# Target column: build a boolean `default` from a source label.
target:
  source_column: "class"      # 1 = good (no default), 2 = bad (default risk)
  output_column: "default"
  mapping:
    "1": 0                     # good  -> 0 (no default)
    "2": 1                     # bad   -> 1 (default)

# Feature mapping: source column -> canonical CreditFlow column.
# A canonical column NOT present in the source is set to `null` and reported
# as missing (it is NOT silently dropped from the report).
features:
  age: "age"                     # age in years
  loan_amount: "credit_amount"    # requested/credit amount
  loan_term: "duration"           # loan duration (months)
  income: null                    # NOT in German Credit -> missing
  employment_years: null          # NOT present as continuous years -> missing
  existing_debt: null             # only a count (existing_credits) exists, not amount -> missing
  credit_history: null            # categorical in source, not years -> missing
  previous_defaults: null         # not directly present -> missing

# Source columns that are NOT mapped to canonical features -> dropped (with reason).
dropped_columns:
  - name: "checking_status"
    reason: "categorical status; no canonical CreditFlow numeric field"
  - name: "savings_status"
    reason: "not part of the 8-feature credit-risk schema"
  - name: "purpose"
    reason: "categorical; not in canonical schema"
  - name: "installment_rate"
    reason: "extra risk indicator; not in canonical schema"
  - name: "personal_status"
    reason: "personal attributes; not in canonical schema"
  - name: "other_parties"
    reason: "not in canonical schema"
  - name: "residence_since"
    reason: "not in canonical schema"
  - name: "property_magnitude"
    reason: "not in canonical schema"
  - name: "other_installment_plans"
    reason: "not in canonical schema"
  - name: "housing"
    reason: "not in canonical schema"
  - name: "existing_credits"
    reason: "count of credits, not debt amount; semantically differs from existing_debt"
  - name: "job"
    reason: "categorical job class; not in canonical schema"
  - name: "num_dependents"
    reason: "not in canonical schema"
  - name: "telephone"
    reason: "not in canonical schema"
  - name: "foreign_worker"
    reason: "not in canonical schema"

processing:
  missing_values_strategy: "report_only"    # do NOT impute at ingest; report instead
  categorical_encoding: "none"                # mapping is numeric-only for NOW
  target_binarization: "from_class_column"

validation:
  # Output columns that MUST exist after mapping for the canonical training path.
  required_output_columns:
    - age
    - employment_years
    - loan_amount
    - loan_term
    - existing_debt
    - credit_history
    - previous_defaults
  range_checks:
    age: [18, 100]
    loan_term: [1, null]
    employment_years: [0, null]
    income: [0, null]