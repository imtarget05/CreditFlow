# Service-Level Objectives for this repo.
#
# Every SLO carries: name, sli (PromQL or gate), target, window, error_budget, alert.
# `sli: gate` means the objective is enforced by a test/load harness, not by a metric.
# Ports match prometheus/prometheus.yml; see that file for the scrape list.
version: "1.0"

constants:
  P95_LATENCY_SECONDS: 2

targets:
  - job: creditflow
    port: 8081
    metrics_path: /metrics/prometheus
    source: CreditFlow service (see prometheus/prometheus.yml)
    uncertain: false
  - job: llm-gateway
    port: 8787
    metrics_path: /metrics
    source: vendored llm-gateway/ in this repo
    uncertain: false

slos:

  - name: predict-availability
    sli: 1 - (creditflow_errors_total / creditflow_requests_total)
    target: 0.99
    window: 30d
    error_budget: 0.01
    alert: ServiceDown

  - name: predict-latency
    sli: creditflow_avg_predict_latency_ms
    target: 300
    window: 7d
    error_budget: 20%
    alert: ServiceDown
    note: "Average /predict latency in milliseconds. The series is a gauge, not a histogram."
