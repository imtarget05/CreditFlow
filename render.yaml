# CreditFlow — Render blueprint (full cloud mirror plane).
#
# Three-cloud architecture:
#   - Frontend : GitHub Pages (imtarget05.github.io/CreditFlow, canonical)
#   - API      : Azure Container Apps (canonical, scale-to-zero)
#   - API      : Render (this file — full mirror; DATABASE_URL points at Neon)
#
# The Render service `creditflow-api` is already linked to this repo in the
# Render dashboard; pushing this file re-syncs it (autoDeploy: true).
# DATABASE_URL switches both pipeline/storage/ledger.py (psycopg) and
# pipeline/agent/checkpointer.py (PostgresSaver) onto the external Neon
# Postgres, so ledger rows and paused HITL workflows survive restarts and
# replicas. Render does NOT provision a managed database for this blueprint —
# the value is set once in the Render dashboard (sync: false, never committed).

services:
  - type: web
    name: creditflow-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      # Render injects PORT at runtime; backend/Dockerfile CMD honors ${PORT}.
      - key: CREDITFLOW_ENV
        value: production
      # Self-contained instance secret (dashboard-visible, unique per service).
      - key: CREDITFLOW_API_KEY
        generateValue: true
      # Comma allow-list consumed by backend/security.py:allowed_origins().
      # Cloudflare Pages is canonical; GitHub Pages kept during transition.
      - key: CREDITFLOW_CORS_ORIGINS
        value: https://imtarget05.github.io
      # Neon Postgres connection string — set in the Render dashboard
      # (sync: false, never committed). Without it the app falls back to the
      # local SQLite ledger + file checkpointer (single-process only).
      - key: DATABASE_URL
        sync: false
      # Optional Workers-AI LLM gateway — opt in from the dashboard:
      # set CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN (sync: false) and
      # flip CREDITFLOW_LLM_PROVIDER to `cloudflare`.
      - key: CREDITFLOW_LLM_PROVIDER
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_MODEL
        sync: false
