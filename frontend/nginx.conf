server {
  listen 8080;
  # Strip /api prefix: frontend gọi /api/health -> backend nhận /health
  # (khớp rewrite vite.config.js ở dev: p.replace(/^\/api/, "")).
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
