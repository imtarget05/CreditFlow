name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend — pytest (unit + API + LangGraph workflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Show installed versions
        run: |
          pip list | grep -Ei 'fastapi|scikit-learn|xgboost|pandas|numpy|langgraph|pytest'

      - name: Run tests (exclude live-network integration tests)
        run: python -m pytest tests/ -q -m "not integration" --strict-markers

  build-frontend:
    name: Frontend — npm ci + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify build output (SPA bundle + _redirects)
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          echo "dist/ OK: index.html + _redirects present"

