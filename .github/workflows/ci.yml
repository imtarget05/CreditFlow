name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-airflow:
    name: Airflow DAG lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: 'python -m pip install --only-binary :all: "ruff==0.17.0"'
      - name: Lint DAGs and DAG tests
        run: ruff check airflow

  test:
    name: Backend — pytest (unit + API + LangGraph workflow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Show installed versions
        run: |
          pip list | grep -Ei 'fastapi|scikit-learn|xgboost|pandas|numpy|langgraph|pytest'

      - name: Run tests (exclude live-network integration + slow workflow + live/infra tests)
        # Test isolation: live/infra-marked tests need real LLM/infra endpoints
        # and never run in default jobs — they run in ci-live.yml (manual).
        # Markers registered in pytest.ini, hence --strict-markers.
        # Hermetic CORS: drop any caller-supplied CREDITFLOW_CORS_ORIGINS so
        # the contract test asserts security.DEFAULT_CORS_ORIGINS, not the
        # developer's loopback .env.
        env:
          CREDITFLOW_CORS_ORIGINS: ""
        run: python -m pytest tests/ airflow/tests/ -q -m "not integration and not slow and not live and not infra" --strict-markers

      # Plan 2026-09-18 safety gates: bundle contract, replay-safe
      # disbursement, simulation-only gateway rejection.
      - name: Safety gates (bundle contract / replay-safe disbursement / simulated gateways)
        run: python -m pytest tests/test_predict_units.py tests/test_models.py tests/test_ledger_units.py tests/test_checkpoint_persistence.py tests/test_api.py -q --strict-markers

      - name: Model artifact integrity (SHA256SUMS over models/production)
        # Fail closed on tamper: any 1-byte change or missing file exits nonzero.
        # After a legitimate retrain, rebuild with:
        #   python scripts/check_artifacts.py --build --dir models/production
        run: python scripts/check_artifacts.py --dir models/production

      - name: Production config rejects simulated gateways
        env:
          CREDITFLOW_ENV: production
        run: |
          python - <<'PY'
          import os
          os.environ["CREDITFLOW_ENV"] = "production"
          from pipeline.agent.nodes import fetch_gateways
          try:
              fetch_gateways({"customer_data": {}, "audit_trail": []})
          except RuntimeError as exc:
              assert "GATEWAY_UNAVAILABLE" in str(exc), str(exc)
              print("OK: production rejects simulated gateways")
          else:
              raise SystemExit("production must fail closed on simulated gateways")
          PY

  test-slow:
    name: Backend — slow workflow tests (LangGraph + ledger, ~minutes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run slow tests (exclude live-network integration + live/infra tests)
        # Test isolation (same rationale as the fast job): a test marked both
        # slow and live/infra must not run on push/PR — ci-live.yml owns those.
        run: python -m pytest tests/ -q -m "slow and not integration and not live and not infra" --strict-markers

  coverage:
    # Coverage ratchet, phase 3: baseline locked 2026-10-08 at TOTAL 80%
    # (fast suite: 413 passed, 2 skipped). Gate set at 75% (5pt buffer) with
    # --cov-fail-under=75 so real backslides fail loudly; raise toward 80%
    # once gateway/statement-parser gaps (55-62%) are covered. No codecov
    # upload: coverage.xml kept as a CI artifact instead.
    name: Backend — coverage (gated at 75%, baseline 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pytest-cov

      - name: Run tests with coverage (fast only, gated)
        run: python -m pytest tests/ -q -m "not integration and not slow and not live and not infra" --strict-markers --cov=pipeline --cov=backend --cov=src --cov-fail-under=75 --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  gitleaks:
    # Secret scanning — HARD GATE (default config). Fails the build on leaks.
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        # GITHUB_TOKEN is mandatory since gitleaks-action v2 (it fetches the PR
        # diff); without it the job fails with "GITHUB_TOKEN is now required to
        # scan pull requests" on every PR, so the gate could not tell a clean
        # PR from a leaking one. v3 because v2 runs on Node 20, which hosted
        # runners no longer execute. Pinned to a full commit SHA so a mutable
        # tag cannot swap what runs here (Sonar S7637).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    # Vulnerability scanning — blocking gate (CRITICAL,HIGH, ignore-unfixed).
    # Ported from SmartDoc (Phase 3/4 parity): fails the merge on actionable CVEs.
    name: Security — Trivy vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy (pinned and checksummed)
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sfL --proto '=https' --tlsv1.2 -o "$asset" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${asset}"
          echo "${TRIVY_SHA256}  ${asset}" | sha256sum -c -
          tar xzf "$asset" trivy
          sudo mv trivy /usr/local/bin/trivy
          sudo chmod +x /usr/local/bin/trivy
      - name: Run Trivy vulnerability scanner (blocking, table output)
        run: |
          set -euo pipefail
          trivy fs \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-version-check \
            --skip-dirs .git,.venv,node_modules,frontend/node_modules,mlruns \
            .

  pip-audit:
    # Dependency audit — blocking after the 2026-11-03 remediation of
    # langgraph-checkpoint-postgres CVE-2026-115883 (3.1.2 -> 3.1.3).
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements-dev.txt

  build-frontend:
    name: Frontend — npm ci + production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production bundle
        run: npm run build

      - name: Verify build output (SPA bundle + _redirects)
        run: |
          test -f dist/index.html
          test -f dist/_redirects
          echo "dist/ OK: index.html + _redirects present"

  sonar:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    needs: [test, coverage]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21 for SonarScanner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SonarCloud token
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is unset or empty. Recreate and configure the GitHub secret before running SonarCloud."
            exit 1
          fi
      - name: SonarCloud scan
        run: |
          set -euxo pipefail
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip \
            -o sonar-scanner.zip
          unzip -q sonar-scanner.zip
          sed -i 's/^use_embedded_jre=true/use_embedded_jre=false/' "$PWD/sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner"
          echo "JAVA_HOME=${JAVA_HOME}"
          export PATH="${JAVA_HOME}/bin:$PWD/sonar-scanner-5.0.1.3006-linux/bin:${PATH}"
          java -version
          "$PWD/sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner" \
            -Dsonar.projectKey=imtarget05_CreditFlow \
            -Dsonar.organization=imtarget05 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.automaticAnalysis=false \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.python.xunit.reportPaths=test-results.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
