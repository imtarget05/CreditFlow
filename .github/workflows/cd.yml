name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: cd-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}/creditflow-api
  IMAGE_WEB: ${{ github.repository }}/creditflow-web
  API_BASE: https://creditflow-api.blackisland-5a3f0246.southeastasia.azurecontainerapps.io

jobs:
  build-api-image:
    name: Docker — build + push creditflow-api to GHCR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha }}

      - name: Build + push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web-image:
    name: Docker — build + push creditflow-web to GHCR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.event.workflow_run.head_sha }}

      - name: Build + push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend-pages:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    needs: [deploy-azure]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ env.API_BASE }}
        run: |
          npm ci
          npm run build

      - name: Copy 404.html to dist (SPA fallback complement)
        working-directory: frontend
        run: cp public/404.html dist/404.html

      - name: Stamp source revision
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('frontend/dist/release.json').write_text(
              json.dumps({'source_sha': os.environ['SOURCE_SHA']}) + '\n',
              encoding='utf-8',
          )
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed frontend identity
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = os.environ['PAGE_URL'].rstrip('/') + '/'
          for attempt in range(10):
              with urllib.request.urlopen(url, timeout=30) as response:
                  html = response.read().decode('utf-8', 'replace')
              with urllib.request.urlopen(url + 'release.json', timeout=30) as response:
                  release = json.load(response)
              if (release.get('source_sha') == os.environ['SOURCE_SHA']
                      and 'CreditFlow — Sổ chấm rủi ro khoản vay' in html):
                  print(f'CreditFlow {os.environ["SOURCE_SHA"]} verified at {url}')
                  break
              if attempt == 9:
                  raise SystemExit(f'Unexpected or stale frontend at {url}')
              time.sleep(10)
          PY

  deploy-azure:
    name: Deploy backend to Azure Container Apps
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy-azure.yml
    with:
      source_sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
