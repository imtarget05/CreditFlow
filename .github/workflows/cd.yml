name: CD

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}/creditflow-api
  IMAGE_WEB: ${{ github.repository }}/creditflow-web

jobs:
  build-api-image:
    name: Docker — build + push creditflow-api to GHCR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short

      - name: Build + push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web-image:
    name: Docker — build + push creditflow-web to GHCR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short

      - name: Build + push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend-pages:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://creditflow-api-ko2h.onrender.com' }}
          VITE_API_KEY: ${{ secrets.CREDITFLOW_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Copy 404.html to dist (SPA fallback complement)
        working-directory: frontend
        run: cp public/404.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend-render:
    name: Deploy backend to Render (deploy hook + readiness + smoke)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [build-api-image, deploy-frontend-pages]
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy via deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not configured. The previous job only echoed success while deploying nothing; a real deploy requires the Render deploy-hook URL (Render dashboard -> creditflow-api service -> Deploy Hook) as a repository secret."
            exit 1
          fi
          curl -sf -X POST "$RENDER_DEPLOY_HOOK" -H "Content-Type: application/json" -d '{"branch": "main"}'
          echo "Render deploy hook triggered."

      - name: Poll production readiness
        env:
          API_BASE: ${{ vars.VITE_API_BASE || 'https://creditflow-api-ko2h.onrender.com' }}
        run: |
          echo "Polling ${API_BASE}/health/ready (Render free-tier cold starts up to ~60s)..."
          for i in $(seq 1 30); do
            if curl -sf --max-time 10 "${API_BASE}/health/ready" > /dev/null 2>&1 \
               || curl -sf --max-time 10 "${API_BASE}/health/live" > /dev/null 2>&1; then
              echo "Production backend ready."
              exit 0
            fi
            echo "Attempt $i/30 — not ready yet"
            sleep 10
          done
          echo "::error::Production backend did not become ready within 5 minutes"
          exit 1

      - name: Production smoke (health, CORS, auth gate, scoring)
        env:
          CREDITFLOW_SMOKE_BASE: ${{ vars.VITE_API_BASE || 'https://creditflow-api-ko2h.onrender.com' }}
          CREDITFLOW_SMOKE_API_KEY: ${{ secrets.CREDITFLOW_API_KEY }}
        run: python3 scripts/smoke_production.py
