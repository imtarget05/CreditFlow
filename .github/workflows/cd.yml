name: CD

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}/creditflow-api
  IMAGE_WEB: ${{ github.repository }}/creditflow-web

jobs:
  build-api-image:
    name: Docker — build + push creditflow-api to GHCR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short

      - name: Build + push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web-image:
    name: Docker — build + push creditflow-web to GHCR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short

      - name: Build + push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend-pages:
    name: Deploy frontend to GitHub Pages
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install + build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE || 'https://creditflow-api-9z1v.onrender.com' }}
          VITE_API_KEY: ${{ secrets.CREDITFLOW_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Copy 404.html to dist (SPA fallback complement)
        working-directory: frontend
        run: cp public/404.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend-render:
    name: Deploy backend to Render (API deploy + readiness + smoke)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [build-api-image, deploy-frontend-pages]
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy via API
        id: deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY / RENDER_SERVICE_ID secrets are not configured. Production redeploy cannot run — add both (Render dashboard -> creditflow-api service: API key + Service ID) or remove this job deliberately. A skipped deploy must never count as success."
            exit 1
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "ERROR: Render deploy failed (HTTP ${HTTP_CODE})"
            echo "$BODY"
            exit 1
          fi
          DEPLOY_ID=$(echo "$BODY" | jq -r '.id // empty')
          if [ -n "$DEPLOY_ID" ]; then
            echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
          fi
          echo "Render deploy triggered: $BODY"

      - name: Wait for Render deploy + poll readiness
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          API_BASE: ${{ vars.VITE_API_BASE || 'https://creditflow-api-9z1v.onrender.com' }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::Render secrets not configured — cannot poll production readiness. Failing loudly instead of skipping."
            exit 1
          fi
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id }}"
          if [ -n "$DEPLOY_ID" ]; then
            echo "Waiting for Render deploy ${DEPLOY_ID} to go live (max 20 min)..."
            for i in $(seq 1 40); do
              STATUS=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
                | jq -r '.status // empty')
              echo "Attempt $i/40 — deploy status: ${STATUS:-unknown}"
              if [ "$STATUS" = "live" ]; then
                echo "Render deploy is live"
                break
              fi
              if [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ] || [ "$STATUS" = "canceled" ] || [ "$STATUS" = "deactivated" ]; then
                echo "::error::Render deploy ended with status: ${STATUS}"
                exit 1
              fi
              sleep 30
            done
            if [ "$STATUS" != "live" ]; then
              echo "::error::Deploy did not reach 'live' within 20 minutes"
              exit 1
            fi
          fi
          echo "Polling ${API_BASE}/health/ready (Render cold starts up to ~60s)..."
          for i in $(seq 1 30); do
            if curl -sf --max-time 10 "${API_BASE}/health/ready" > /dev/null 2>&1 \
               || curl -sf --max-time 10 "${API_BASE}/health/live" > /dev/null 2>&1; then
              echo "Production backend ready."
              exit 0
            fi
            echo "Attempt $i/30 — not ready yet"
            sleep 10
          done
          echo "::error::Production backend did not become ready within 5 minutes"
          exit 1

      - name: Production smoke (health, CORS, auth gate, scoring)
        env:
          CREDITFLOW_SMOKE_BASE: ${{ vars.VITE_API_BASE || 'https://creditflow-api-9z1v.onrender.com' }}
          CREDITFLOW_SMOKE_API_KEY: ${{ secrets.CREDITFLOW_API_KEY }}
        run: |
          if [ -z "${CREDITFLOW_SMOKE_API_KEY:-}" ]; then
            echo "::error::CREDITFLOW_SMOKE_API_KEY secret missing — protected-read smoke cannot run; failing instead of a silent green."
            exit 1
          fi
          python3 scripts/smoke_production.py
