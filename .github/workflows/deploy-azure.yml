name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    name: Test & Deploy to Azure
    runs-on: ubuntu-latest
    # Deploy gate context.
    #
    # `AZURE_CREDENTIALS` used to be declared as a *step-level* env, and a
    # step's own `env:` block is NOT part of the `env` context that GitHub
    # exposes to that same step's `if:`. Both `azure/login` and the deploy step
    # therefore evaluated `env.AZURE_CREDENTIALS != ''` against an empty
    # string, were always skipped, and the job still reported success — a green
    # "Deploy to Azure" run that deployed nothing. Declaring the credential at
    # job level puts it in the `env` context, so the gate is now real: with the
    # secret configured the condition is true and the deploy runs; without it the
    # deploy is skipped and the final step says so in the run summary.
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies & pytest
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Test Suite
        run: PYTHONPATH=. pytest tests/ -q -m "not integration and not slow and not live and not infra" --strict-markers

      - name: Enforce the existing production simulation gate
        env:
          CREDITFLOW_ENV: production
        run: |
          python - <<'PY'
          from pipeline.agent.nodes import fetch_gateways
          try:
              fetch_gateways({"customer_data": {}, "audit_trail": []})
          except RuntimeError as exc:
              assert "GATEWAY_UNAVAILABLE" in str(exc), str(exc)
              print("OK: production rejects simulated gateways")
          else:
              raise SystemExit("production must fail closed on simulated gateways")
          PY

      - name: Log in to Azure (using AZURE_CREDENTIALS secret)
        uses: azure/login@v2
        if: env.AZURE_CREDENTIALS != ''
        with:
          creds: ${{ env.AZURE_CREDENTIALS }}

      - name: Build & Deploy via Azure CLI
        if: env.AZURE_CREDENTIALS != ''
        env:
          CREDITFLOW_API_KEY: ${{ secrets.CREDITFLOW_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CREDITFLOW_API_KEY:-}" ]; then
            echo "::error::CREDITFLOW_API_KEY secret is required to deploy the protected Azure API."
            exit 1
          fi
          chmod +x deploy/scripts/deploy-azure.sh
          ./deploy/scripts/deploy-azure.sh

      - name: Azure production readiness and API smoke
        if: env.AZURE_CREDENTIALS != ''
        env:
          CREDITFLOW_SMOKE_BASE: https://creditflow-api.blackisland-5a3f0246.southeastasia.azurecontainerapps.io
          CREDITFLOW_SMOKE_API_KEY: ${{ secrets.CREDITFLOW_API_KEY }}
        run: python3 scripts/smoke_production.py

      - name: Report deploy status
        if: always()
        run: |
          if [ -z "${AZURE_CREDENTIALS:-}" ]; then
            echo "::error title=Azure deploy NOT run::AZURE_CREDENTIALS is not configured; deploy steps were skipped. This run verified the test subset only and is a FAILED deploy." >&2
            exit 1
          else
            echo "AZURE_CREDENTIALS is configured. Check the test, login, deploy and smoke step results above to determine release status."
          fi
