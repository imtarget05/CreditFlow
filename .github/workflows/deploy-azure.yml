name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'pipeline/**'
      - 'models/**'
      - 'requirements.txt'
      - '.github/workflows/deploy-azure.yml'

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    name: Test & Deploy to Azure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies & pytest
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run Test Suite
        run: PYTHONPATH=. pytest tests/test_features.py tests/test_threshold.py tests/test_drift.py -q

      - name: Log in to Azure (using AZURE_CREDENTIALS secret)
        uses: azure/login@v2
        if: env.AZURE_CREDENTIALS != ''
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build & Deploy via Azure CLI
        if: env.AZURE_CREDENTIALS != ''
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          chmod +x deploy/scripts/deploy-azure.sh
          ./deploy/scripts/deploy-azure.sh
