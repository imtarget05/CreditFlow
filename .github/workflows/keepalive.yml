# Manual health probe for the configured Azure Container Apps API.
#
# The endpoint is checked only on manual dispatch; no scheduled traffic is sent.
name: Keepalive

"on":
  workflow_dispatch:

jobs:
  ping:
    name: Ping Azure health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping creditflow-api (best-effort)
        run: |
          set -euo pipefail
          URL="https://creditflow-api.blackisland-5a3f0246.southeastasia.azurecontainerapps.io/health/live"
          echo "Pinging $URL"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
          echo "→ HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Keepalive ping to $URL returned HTTP $STATUS (expected 200)."
          else
            echo "Service awake."
          fi
