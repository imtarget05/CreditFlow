[pytest]
markers =
    integration: marks tests as integration tests that require external network or build tools
    slow: marks tests that take tens of seconds (full LangGraph + model runs); excluded from the fast CI job
    adversarial: double-entry / tamper-evidence / replay-attack property tests
    race: concurrency / replay / idempotency property tests
    live: tests requiring a live LLM gateway or model endpoint (skipped unless LIVE_TESTS=1)
    infra: tests requiring live infrastructure (Postgres, Qdrant); skipped unless LIVE_TESTS=1
